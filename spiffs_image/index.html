<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>BME680 Sensor Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 20px;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        p {
            color: #555;
            font-size: 1.2em;
        }

        .sensor {
            margin-bottom: 10px;
        }

        a,
        button {
            margin: 5px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #45a049;
        }

        .collapsible {
            background-color: #777;
            color: white;
            cursor: pointer;
            padding: 10px;
            width: 100%;
            border: none;
            text-align: left;
            outline: none;
            font-size: 16px;
            border-radius: 5px;
            margin-top: 20px;
        }

        .collapsible:hover {
            background-color: #555;
        }

        .content {
            padding: 10px 20px;
            display: none;
            overflow: hidden;
            background-color: #f9f9f9;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .content label,
        .content input {
            display: block;
            margin-top: 10px;
            font-size: 1em;
        }

        .content button {
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h1>BME680 Sensor Data</h1>
    <div id="time" class="sensor">Timestamp: -</div>
    <div id="temp" class="sensor">Temperature: - °C</div>
    <div id="hum" class="sensor">Humidity: - %</div>
    <div id="press" class="sensor">Pressure: - hPa</div>
    <div id="gas" class="sensor">Gas Resistance: - Ohm</div>

    <a href="/download" target="_blank">
        <button type="button">Show Log</button>
    </a>
    <button onclick="confirmErase()">Erase Log</button>
    <button onclick="confirmReinitialize()">Reinitialize System</button>

    <script>
        const timeEl = document.getElementById("time");
        const tempEl = document.getElementById("temp");
        const humEl = document.getElementById("hum");
        const pressEl = document.getElementById("press");
        const gasEl = document.getElementById("gas");

        let ws;
        let retryDelay = 1000;
        const maxDelay = 10000;

        function connectWebSocket() {
            ws = new WebSocket(`ws://${location.host}/ws`);

            ws.onopen = () => {
                console.log("WebSocket connected");
                retryDelay = 1000;
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    timeEl.textContent = `Timestamp: ${data.timestamp ?? '-'}`;
                    tempEl.textContent = `Temperature: ${data.temperature?.toFixed(2) ?? '-'} °C`;
                    humEl.textContent = `Humidity: ${data.humidity?.toFixed(2) ?? '-'} %`;
                    pressEl.textContent = `Pressure: ${data.pressure?.toFixed(2) ?? '-'} hPa`;
                    gasEl.textContent = `Gas Resistance: ${data.gas_resistance?.toFixed(2) ?? '-'} Ohm`;
                } catch (e) {
                    console.error("Failed to parse WebSocket data", e);
                }
            };

            ws.onclose = () => {
                console.warn(`WebSocket closed. Retrying in ${retryDelay / 1000}s...`);
                setTimeout(connectWebSocket, retryDelay);
                retryDelay = Math.min(retryDelay * 2, maxDelay);
            };

            ws.onerror = (err) => {
                console.error("WebSocket error", err);
                ws.close();
            };
        }

        connectWebSocket();

        function confirmErase() {
            if (confirm("Are you sure you want to erase the log?")) {
                fetch("/delete_log").then(res => {
                    alert(res.ok ? "Log file erased" : "Failed to erase log");
                });
            }
        }

        function confirmReinitialize() {
            if (confirm("Are you sure you want to reinitialize the system?")) {
                fetch("/reinitialize").then(res => {
                    alert(res.ok ? "System reinitialized" : "Failed to reinitialize system");
                });
            }
        }
    </script>

    <button class="collapsible">⚙️ Settings</button>
    <div class="content">
        <h3>WiFi Configuration</h3>
        <label>SSID:</label>
        <input type="text" id="ssid">
        <label>Password:</label>
        <input type="password" id="password">
        <button onclick="submitWifiConfig()">Set WiFi</button>

        <hr>

        <h4>SoftAP Configuration</h4>
        <label for="softap_ssid">SSID:</label>
        <input type="text" id="softap_ssid"><br>

        <label for="softap_password">Password:</label>
        <input type="password" id="softap_password"><br>

        <label for="softap_authmode">Auth Mode:</label>
        <select id="softap_authmode">
        <option value="0">WIFI_AUTH_OPEN</option>
        <option value="1">WIFI_AUTH_WEP</option>
        <option value="2">WIFI_AUTH_WPA_PSK</option>
        <option value="3" selected>WIFI_AUTH_WPA2_PSK</option>
        <option value="7">WIFI_AUTH_WPA3_PSK</option>
        </select><br>

        <button onclick="submitSoftAPConfig()">Apply SoftAP Settings</button>
        <button onclick="confirmEraseSoftAP()">Default Settings</button>
    </div>

    

    <script>
        document.querySelector(".collapsible").addEventListener("click", function () {
            this.classList.toggle("active");
            const content = this.nextElementSibling;
            content.style.display = content.style.display === "block" ? "none" : "block";
        });
    </script>

    <script>
        function submitWifiConfig() {
            const ssid = document.getElementById("ssid").value;
            const password = document.getElementById("password").value;

            fetch("/set_wifi", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ ssid, password })
            }).then(res => {
                alert(res.ok ? "WiFi credentials saved. Rebooting..." : "Failed to save WiFi credentials.");
            });
        }

        function submitSoftAPConfig() {
            const ssid = document.getElementById("softap_ssid").value;
            const password = document.getElementById("softap_password").value;
            const authmode = parseInt(document.getElementById("softap_authmode").value);

            fetch("/set_softap", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ ssid, password, authmode })
            }).then(res => {
                alert(res.ok ? "SoftAP config saved. Rebooting..." : "Failed to save SoftAP config.");
            });
        }

        function confirmEraseSoftAP() {
            if (confirm("Erase SoftAP NVS credentials and restore default values?")) {
                fetch("/erase_softap").then(res => {
                    alert(res.ok ? "SoftAP NVS erased. Rebooting..." : "Failed to erase SoftAP NVS.");
                });
            }
        }
    </script>

</body>
</html>
