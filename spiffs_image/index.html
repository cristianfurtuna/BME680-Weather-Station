<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>BME680 Sensor Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 20px;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        p {
            color: #555;
            font-size: 1.2em;
        }
        .sensor {
            margin-bottom: 10px;
        }
        a, button {
            margin: 5px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>BME680 Sensor Data</h1>
    <div id="time" class="sensor">Timestamp: -</div>
    <div id="temp" class="sensor">Temperature: - °C</div>
    <div id="hum" class="sensor">Humidity: - %</div>
    <div id="press" class="sensor">Pressure: - hPa</div>
    <div id="gas" class="sensor">Gas Resistance: - Ohm</div>

    <a href="/download" target="_blank">
        <button type="button">Show Log</button>
    </a>
    <button onclick="confirmErase()">Erase Log</button>
    <button onclick="confirmReinitialize()">Reinitialize System</button>

    <script>
    const timeEl = document.getElementById("time");
    const tempEl = document.getElementById("temp");
    const humEl = document.getElementById("hum");
    const pressEl = document.getElementById("press");
    const gasEl = document.getElementById("gas");

    let ws;
    let retryDelay = 1000; 
    const maxDelay = 10000;

    function connectWebSocket() {
        ws = new WebSocket(`ws://${location.host}/ws`);

        ws.onopen = () => {
            console.log("WebSocket connected");
            retryDelay = 1000; 
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                timeEl.textContent = `Timestamp: ${data.timestamp ?? '-'}`;
                tempEl.textContent = `Temperature: ${data.temperature?.toFixed(2) ?? '-'} °C`;
                humEl.textContent = `Humidity: ${data.humidity?.toFixed(2) ?? '-'} %`;
                pressEl.textContent = `Pressure: ${data.pressure?.toFixed(2) ?? '-'} hPa`;
                gasEl.textContent = `Gas Resistance: ${data.gas_resistance?.toFixed(2) ?? '-'} Ohm`;
            } catch (e) {
                console.error("Failed to parse WebSocket data", e);
            }
        };

        ws.onclose = () => {
            console.warn(`WebSocket closed. Retrying in ${retryDelay / 1000}s...`);
            setTimeout(connectWebSocket, retryDelay);
            retryDelay = Math.min(retryDelay * 2, maxDelay); 
        };

        ws.onerror = (err) => {
            console.error("WebSocket error", err);
            ws.close();
        };
    }

    connectWebSocket();

    function confirmErase() {
        if (confirm("Are you sure you want to erase the log?")) {
            fetch("/delete_log").then(res => {
                alert(res.ok ? "Log file erased" : "Failed to erase log");
            });
        }
    }

    function confirmReinitialize() {
        if (confirm("Are you sure you want to reinitialize the system?")) {
            fetch("/reinitialize").then(res => {
                alert(res.ok ? "System reinitialized" : "Failed to reinitialize system");
            });
        }
    }
</script>
</body>
</html>
